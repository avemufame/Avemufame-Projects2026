<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <link  rel="stylesheet" href="./style/songbook_style.css" >

    <title>Songbook Pro</title>

    </head>
    <body onload="main()">
        <div id="welcome-screen">
            <div class="welcome-card">
                <h1>🎵 SONGBOOK</h1>
                <p>Benvenuto nel tuo studio musicale virtuale</p>
                <div class="welcome-buttons">
                    <button onclick="avviaNuovaCanzone()">➕ Nuova Canzone</button>
                    <button onclick="apriCanzoneEsistente()">📂 Apri Canzone</button>
                   
                </div>
            </div>
        </div>
    
        <!-- 🌟 2. STRUTTURA APPLICAZIONE -->
        <div id="app-layout" class="hidden">
            
            <!-- BARRA LATERALE -->
            <nav class="sidebar">
                <button onclick="toggleSection('video-section')">📷 Video</button>
                <button onclick="toggleSection('notes-section')">📝 Note</button>
                <button onclick="toggleSection('chords-section')">🎵 Accordi</button>
                <button onclick="toggleGuitarTabsLayout()">🎸 Guitar Tab</button>
            </nav>
    
            <!-- CONTENUTO PRINCIPALE -->
            <div id="main-structure">
                
                <!-- BARRA IN ALTO -->
                <header id="top-audio-bar">
                    <div onclick="tornaHome()" id="app-logo">SONGBOOK</div>
                    
                    <div id="song-info-panel">
                        <div class="info-input-group">
                            <label>Titolo Canzone</label>
                            <input type="text" id="song-title-input" placeholder="Inserisci titolo...">
                        </div>
                        <div class="info-input-group">
                            <label>BPM</label>
                            <input type="number" id="song-bpm-input" placeholder="120" min="40" max="250">
                        </div>
                        <div class="info-input-group">
                            <label>Tempo</label>
                            <select id="song-time-input">
                                <option value="4/4">4/4</option>
                                <option value="3/4">3/4</option>
                                <option value="6/8">6/8</option>
                                <option value="2/4">2/4</option>
                                <option value="12/8">12/8</option>
                            </select>
                        </div>
                        <div class="info-input-group">
                            <label>Tonalità</label>
                            <input type="text" id="song-key-input" placeholder="Es: Do Mag">
                        </div>
                    </div>
                    
                    <div class="audio-controls">
                        <button id="rec-audio" onclick="gestisciRegistrazioneAudio()">🎙️ Solo Audio</button>
                        <audio id="audio-player" controls></audio>
                    </div>
                </header>
    
                <!-- AREA DI LAVORO CON I MODULI -->
                <div id="workspace-container" class="layout-standard">
                    <div id="top-modules-row">
                        
                        <section id="notes-section" class="window hidden">
                            <h3>📝 Note</h3>
                            <textarea id="notepad" placeholder="Scrivi arrangiamenti o idee..."></textarea>
                        </section>
                        
                        <section id="chords-section" class="window hidden">
                            <h3>🎵 Accordi Struttura</h3>
                            <textarea id="chordpad" placeholder="Es: Strofa: Do | Lam | Fa | Sol..."></textarea>
                        </section>
    
                        <section id="video-section" class="window hidden">
                            <h3>📷 Camera</h3>
                            <canvas id="myCanvas"></canvas>
                        </section>
                        
                    </div>
    
                    <!-- PANNELLO DELLA TABLATURA IN BASSO -->
                    <section id="tabs-section">
                        <div class="tab-header">
                            <h5>🎸 TABLATURE CHITARRA INTERATTIVA</h5>
                            <div>
                                <button onclick="aggiungiNuovaLineaTab()" class="mini-btn">➕ Aggiungi Linea</button>
                                <button onclick="pulisciTablatura()" class="mini-btn danger">🧹 Svuota</button>
                            </div>
                        </div>
                        <div id="tab-grid-container">
                            <!-- Generato dinamicamente da JS -->
                        </div>
                    </section>
    
                </div> <!-- Chiusura workspace-container -->
            </div> <!-- Chiusura main-structure -->
        </div> <!-- Chiusura app-layout -->
    
        <!-- Il menu a comparsa per selezionare i numeri con il mouse -->
        <div id="tab-drop-menu"></div>
    
        <!-- Collegamento al file javascript -->
        <script src="./script/script_songbook.js"></script>
    </body>
    </html>
